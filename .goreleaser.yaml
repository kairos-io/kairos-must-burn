version: 2

project_name: kairos-must-burn
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -w -s -H=windowsgui
    binary: '{{ .ProjectName }}_{{ .Tag }}_windows_amd64.exe'
    id: build-windows
  - env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -w -s
    binary: '{{ .ProjectName }}_{{ .Tag }}_linux_amd64'
    id: build-linux
  - env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -w -s
    binary: '{{ .ProjectName }}_{{ .Tag }}_darwin_arm64'
    # TODO: after build, it should copy the binary into the kairos-must-burn.app dir to have a proper macos app
    id: build-darwin